[project]
name = "ghevents"
version = "0.1.0"
description = "Parse GH events"
readme = "README.md"
authors = [
    { name = "Charlotte Webster", email = "yvw3nq@virginia.edu" }
]
requires-python = ">=3.14"
dependencies = [
    "requests>=2.34.2",
]

[project.scripts]
ghevents = "ghevents:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
